name: Admin Maintenance

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "self_heal_prevalidate or validate"
        required: true
        default: "validate"
      receipt_id:
        required: false
        default: ""
      requested_by:
        required: false
        default: ""
      request_reason:
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: horse-legal-guide-main-writer
  cancel-in-progress: false
jobs:
  maintenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: git pull --rebase origin main
      - name: Execute guarded maintenance
        id: operation
        continue-on-error: true
        env:
          OPERATION_INPUT: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$OPERATION_INPUT" in
            self_heal_prevalidate)
              npm run content:self-heal
              npm run content:prevalidate
              npm run build
              npm run validate:all
              ;;
            validate)
              npm run build
              npm run validate:all
              ;;
            *) echo "Unknown operation: $OPERATION_INPUT"; exit 1 ;;
          esac
      - name: Commit self-healed pending drafts and reports
        if: ${{ steps.operation.outcome == 'success' && inputs.operation == 'self_heal_prevalidate' }}
        run: |
          git config user.name "horse-legal-guide-admin"
          git config user.email "actions@github.com"
          git add content/drafts/generated data/system/editorial_backlog.json data/system/content_calendar.json data/admin reports/quality dist .build
          if git diff --cached --quiet; then
            echo "No self-heal changes to commit."
          else
            git commit -m "chore: self-heal and prevalidate pending drafts"
            git push origin main
          fi

      - name: Write authenticated action receipt
        if: ${{ always() && inputs.receipt_id != '' }}
        env:
          RECEIPT_ID: ${{ inputs.receipt_id }}
          REQUESTED_BY: ${{ inputs.requested_by }}
          REQUEST_REASON: ${{ inputs.request_reason }}
          ACTION_STATUS: ${{ steps.operation.outcome }}
          OPERATION: ${{ inputs.operation || inputs.action }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: node scripts/admin/write_action_receipt.js
      - name: Commit authenticated action receipt
        if: ${{ always() && inputs.receipt_id != '' }}
        run: |
          git config user.name "horse-legal-guide-admin"
          git config user.email "actions@github.com"
          git add data/admin/action_receipts
          if git diff --cached --quiet; then
            echo "No receipt change to commit."
          else
            git commit -m "chore: record authenticated admin action"
            git push origin main
          fi
      - name: Preserve operation failure
        if: ${{ steps.operation.outcome != 'success' }}
        run: exit 1
