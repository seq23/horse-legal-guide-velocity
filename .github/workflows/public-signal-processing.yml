name: Public Signal Processing

on:
  workflow_dispatch:
  schedule:
    - cron: "30 13 * * 1-5"

permissions:
  contents: write

concurrency:
  group: horse-legal-guide-main-writer
  cancel-in-progress: false

jobs:
  process-public-signals:
    runs-on: ubuntu-latest
    env:
      SITE_DOMAIN: https://horselegalguide.com
      CANONICAL_DOMAIN: https://wisecovington.com
      GSC_SITE_URL: sc-domain:horselegalguide.com
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      INDEXNOW_KEY_LOCATION: https://horselegalguide.com/indexnow.txt
      # The Reddit adapters cannot finish inside 7s and never could. Collection is
      # sequential on purpose, each Reddit source walks 3 search terms, and
      # REDDIT_PUBLIC_DELAY_MS puts a deliberate 900ms pause between them to stay
      # under Reddit's rate limit - so ~2.7s of every source's budget is spent
      # sleeping before a single response is parsed. Measured locally at the old
      # values, all five Reddit sources timed out; at these values none do.
      SIGNAL_SOURCE_TIMEOUT_MS: "25000"
      SIGNAL_COLLECTION_RUNTIME_MS: "360000"
      SIGNAL_FETCH_TIMEOUT_MS: "12000"
      SIGNAL_COLLECT_SEQUENTIAL: "true"
      REDDIT_PUBLIC_PREFER_RSS: "true"
      REDDIT_PUBLIC_LIMIT: "5"
      REDDIT_PUBLIC_MAX_SIGNALS: "20"
      REDDIT_PUBLIC_TERM_LIMIT: "3"
      REDDIT_PUBLIC_DELAY_MS: "900"
      COLLECT_LIVE_SIGNALS: "1"
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_SEARCH_MODEL: gemini-flash-lite-latest
    steps:
      # REFUSE_NON_MAIN: this lane pushes HEAD:main, so a dispatch from any other
      # ref would publish that branch to main. The push target is deliberately
      # literal, so the ref is gated here instead of making the target dynamic.
      - name: Refuse to process signals from a non-main ref
        run: |
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "REFUSED: this lane pushes HEAD:main; refusing to run on $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Collect public signals
        run: npm run collect:signals
      - name: Normalize signals
        run: npm run normalize:signals
      - name: Map signals to targets
        run: npm run map:signals
      - name: Generate ingestion report
        run: npm run report:ingestion
      - name: Build admin signal health
        run: npm run build
      - name: Validate approved-only public output
        run: npm run validate:publish-safety
      - name: Generate workflow trace
        run: npm run ops:trace-workflows
      - name: Validate
        run: npm run validate:all
      - name: Commit generated updates
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No public signal updates to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Run public signal processing"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
