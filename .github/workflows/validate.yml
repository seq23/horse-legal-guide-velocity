name: Validate Repo

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    timeout-minutes: 5  # ~3x median 0.7m over 8 green runs; fault detector, not a budget
    runs-on: ubuntu-latest
    env:
      SITE_DOMAIN: https://horselegalguide.com
      CANONICAL_DOMAIN: https://wisecovington.com
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      INDEXNOW_KEY_LOCATION: https://horselegalguide.com/indexnow.txt
      GSC_SITE_URL: sc-domain:horselegalguide.com
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Preflight
        run: npm run validate:preflight
      - name: Build
        run: npm run build
      - name: Generate workflow trace
        run: npm run ops:trace-workflows
      - name: Behavioral publish-safety tests
        run: npm test
      - name: Authority modernization gate
        run: npm run validate:authority-modernization
      - name: Validate
        run: npm run validate:all
      - name: Cadence gate
        # Blocks publishing faster than the library can be kept inside the
        # 91-day window where pages stay citable. Warnings are reported
        # without failing the run.
        run: npm run cadence:gate

  indexnow-after-deploy:
    # Tells IndexNow (Bing, Yandex, Seznam, Naver...) about every sitemap URL once
    # the Cloudflare Pages deploy of this commit is live. Guarded by
    # _ops/validators/validate_indexnow_key_file.js.
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 35  # up to 25 min Pages-deploy wait (PR #47 preview build took 9.5 min) + up to ~6 min IndexNow verification retries
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
    env:
      SITE_DOMAIN: https://horselegalguide.com
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Ping IndexNow with the live sitemap URLs
        run: node scripts/indexing/ping_indexnow_after_deploy.mjs
