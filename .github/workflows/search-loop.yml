name: Search Loop

# The shared search growth engine (seq23/search-loop @v1). Owner ruling 1 Nov 2026:
# find easy searches weekly, publish gated question pages under /questions/ daily,
# check every page at 2/4/8 weeks, strengthen / undo / merge, upload the weekly
# report artifact "search-loop-week".
# Horse ruling (1 Nov 2026): question pages are HIDDEN - never in the nav, a hub or
# a section index; linked only through Related questions blocks, the sitemap and
# IndexNow (scripts/search_loop/fold_question_pages.js). Menu pages need client
# approval and are never edited (menu_pages_need_approval). Every question page
# passes the legal gate in the fold step before it is served.
# Throttle without touching this repo: gh variable set SEARCH_LOOP_MODE --body slow -R seq23/search-loop
on:
  schedule:
    - cron: "23 13 * * *"  # America/Chicago 07:23 CST / 08:23 CDT
  workflow_dispatch:
    inputs:
      stage:
        description: "auto | find | build | check"
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: search-loop
  cancel-in-progress: false

jobs:
  search-loop:
    uses: seq23/search-loop/.github/workflows/search-loop.yml@v1
    with:
      engine_ref: v1
      stage: ${{ inputs.stage || 'auto' }}
      setup_command: npm ci --ignore-scripts && npm run build >/dev/null && node scripts/search_loop/mirror_site.js
      post_build_command: node scripts/search_loop/mirror_site.js --clean && npm run build
      commit_command: ./.github/scripts/search_loop_commit.sh
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      # $0 model lanes (engine v1.2.3): Gemini free tier (no-billing project), metered Workers AI
      # (usage read with the analytics token, model run with the Workers AI token; 600 neurons/day).
      CLOUDFLARE_API_TOKEN: ${{ secrets.SEARCH_LOOP_CF_USAGE_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SEARCH_LOOP_CF_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.SEARCH_LOOP_CF_WORKERS_AI_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.SEARCH_LOOP_GEMINI_API_KEY }}
