name: Search Loop

# The shared search growth engine (seq23/search-loop, pinned @v1.5.1). Owner ruling 1 Nov 2026:
# find easy searches weekly, publish gated question pages under /questions/ daily,
# check every page at 2/4/8 weeks, strengthen / undo / merge, upload the weekly
# report artifact "search-loop-week".
# v1.5.1 also supplies the free-zone Web Analytics fallback and retries failed daily reads;
# the token mapping alone cannot measure referrals while pinned to v1.4.0.
# Approval mode (owners' ruling, 3 Nov 2026): every new page waits in the owners' queue
# (/admin/, data/search-loop/pending/) and goes live only once approved there;
# search-loop.config.json "approval". Pinned, not @v1, so a moved tag can never
# publish without approval. 3 new pages a day at most (cap.max_per_day).
# Horse ruling (1 Nov 2026): question pages are HIDDEN - never in the nav, a hub or
# a section index; linked only through Related questions blocks, the sitemap and
# IndexNow (scripts/search_loop/fold_question_pages.js). Menu pages need client
# approval and are never edited (menu_pages_need_approval). Every question page
# passes the legal gate in the fold step before it is served.
# Throttle without touching this repo: gh variable set SEARCH_LOOP_MODE --body slow -R seq23/search-loop
on:
  schedule:
    - cron: "23 13 * * *"  # America/Chicago 07:23 CST / 08:23 CDT
  workflow_dispatch:
    inputs:
      stage:
        description: "auto | find | build | check"
        required: false
        default: auto
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: search-loop
  cancel-in-progress: false

jobs:
  search-loop:
    uses: seq23/search-loop/.github/workflows/search-loop.yml@v1.5.1
    with:
      open_loops_business: friends
      engine_ref: v1.5.1
      stage: ${{ inputs.stage || 'auto' }}
      setup_command: npm ci --ignore-scripts && npm run build >/dev/null && node scripts/search_loop/mirror_site.js
      post_build_command: node scripts/search_loop/mirror_site.js --clean && npm run build
      commit_command: ./.github/scripts/search_loop_commit.sh
    secrets:
      BOSS_OPEN_LOOPS_TOKEN: ${{ secrets.BOSS_OPEN_LOOPS_TOKEN }}  # named stops -> Boss OS Open Loops (search-loop v1.7.0)
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      # $0 model lanes (engine v1.2.3+): Gemini free tier (no-billing project), metered Workers AI
      # (usage read with the analytics token, model run with the Workers AI token; 600 neurons/day).
      # CLOUDFLARE_API_TOKEN is the engine's ONE read token, and it reads three things: today's
      # Workers AI neurons (account aiInferenceAdaptiveGroups) and the two weekly AI numbers
      # Search Readiness item f11 is measured on - AI-bot reads from the zone's
      # httpRequestsAdaptiveGroups by user agent, and, on this free zone (which has no
      # clientRefererHost field), AI-referral visits from Cloudflare Web Analytics
      # (account rumPageloadEventsAdaptiveGroups). SEARCH_LOOP_CF_USAGE_TOKEN held the Workers AI
      # usage scope alone, so every day's analytics read was refused ("does not have permission
      # com.cloudflare.api.account.z...") and the weekly report carried "not read" for both numbers
      # from 1 Nov 2026 on. SEARCH_LOOP_CF_ANALYTICS_TOKEN holds all three reads; each was probed
      # read-only against this zone on 3 Nov 2026 before this line changed.
      CLOUDFLARE_API_TOKEN: ${{ secrets.SEARCH_LOOP_CF_ANALYTICS_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.SEARCH_LOOP_CF_ACCOUNT_ID }}
      CLOUDFLARE_WORKERS_AI_TOKEN: ${{ secrets.SEARCH_LOOP_CF_WORKERS_AI_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.SEARCH_LOOP_GEMINI_API_KEY }}
