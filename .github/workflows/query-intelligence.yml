name: Provider Query Intelligence

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "rebuild or admit_candidates"
        required: true
        default: "rebuild"
      ids:
        description: "Space-separated provider opportunity IDs for admission"
        required: false
        default: ""
      receipt_id:
        required: false
        default: ""
      requested_by:
        required: false
        default: ""
      request_reason:
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: horse-legal-guide-main-writer
  cancel-in-progress: false
jobs:
  query-intelligence:
    runs-on: ubuntu-latest
    env:
      # Primary provider for live citation observation. Gemini grounding is a
      # 429-blocked fallback on this project; see live_query_observer.js.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Pinned to the moving alias on purpose. gemini-2.5-flash-lite was retired -
      # "no longer available to new users" - and every grounded observation came
      # back 404, which recorded 30 provider_error rows that looked like a broken
      # integration rather than a dead model name. An alias cannot go stale the
      # same way.
      GEMINI_SEARCH_MODEL: gemini-flash-lite-latest
      LIVE_QUERY_LIMIT: "30"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - run: git pull --rebase origin main
      # Real measured demand before anything reasons about queries. Evidence-only:
      # it merges rather than overwrites, never drops existing rows, and does not
      # admit, publish, or change the publishing cadence. Without credentials it
      # exits 0 and leaves the evidence file untouched.
      - name: Ingest measured Search Console queries
        env:
          GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
        run: |
          if [ -z "${GSC_SERVICE_ACCOUNT_JSON:-}" ]; then echo 'GSC skipped: not configured'; exit 0; fi
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet google-api-python-client google-auth
          npm run queries:ingest
      - name: Execute query-intelligence operation
        id: operation
        continue-on-error: true
        env:
          OPERATION_INPUT: ${{ inputs.operation }}
          IDS_INPUT: ${{ inputs.ids }}
        run: |
          set -euo pipefail
          read -r -a IDS <<< "$IDS_INPUT"
          # search:cycle ends in search:prepare-repairs, which reads the page
          # manifests `npm run build` writes to .build/page-manifests/. Build
          # first so the repair plan is derived from this run's own pages rather
          # than from whatever manifest the previous run left committed. The
          # build after the cycle then carries its query_repair_queue.json into
          # dist/data/.
          npm run build
          npm run search:cycle
          node scripts/query/build_provider_query_intelligence.js
          case "$OPERATION_INPUT" in
            rebuild)
              node scripts/agency/generate_agency_report.js
              npm run build
              npm run validate:query-intelligence
              ;;
            admit_candidates)
              node scripts/query/admit_provider_candidates.js "${IDS[@]}"
              npm run generate:drafts
              npm run content:self-heal
              npm run content:prevalidate
              npm run build
              npm run validate:all
              ;;
            *) echo "Unknown operation: $OPERATION_INPUT"; exit 1 ;;
          esac
      - name: Commit query intelligence and pending drafts
        if: ${{ steps.operation.outcome == 'success' }}
        run: |
          git config user.name "horse-query-intelligence"
          git config user.email "actions@github.com"
          git add data/search data/system data/query_intelligence reports/query_intelligence data/remediation reports/remediation data/agency reports/agency content/drafts/generated data/system/editorial_backlog.json data/system/content_calendar.json data/admin reports/quality dist .build
          if git diff --cached --quiet; then
            echo "No query intelligence changes to commit."
          else
            git commit -m "chore: update provider query intelligence"
            git push origin main
          fi

      - name: Write authenticated action receipt
        if: ${{ always() && inputs.receipt_id != '' }}
        env:
          RECEIPT_ID: ${{ inputs.receipt_id }}
          REQUESTED_BY: ${{ inputs.requested_by }}
          REQUEST_REASON: ${{ inputs.request_reason }}
          ACTION_STATUS: ${{ steps.operation.outcome }}
          OPERATION: ${{ inputs.operation || inputs.action }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: node scripts/admin/write_action_receipt.js
      - name: Commit authenticated action receipt
        if: ${{ always() && inputs.receipt_id != '' }}
        run: |
          git config user.name "horse-legal-guide-admin"
          git config user.email "actions@github.com"
          git add data/admin/action_receipts
          if git diff --cached --quiet; then
            echo "No receipt change to commit."
          else
            git commit -m "chore: record authenticated admin action"
            git push origin main
          fi
      - name: Preserve operation failure
        if: ${{ steps.operation.outcome != 'success' }}
        run: exit 1
