name: Deploy Distribution

on:
  workflow_run:
    workflows: ["Manual Publish"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: horse-legal-guide-main-writer
  cancel-in-progress: false
jobs:
  deploy-distribution:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SITE_DOMAIN: https://horselegalguide.com
      CANONICAL_DOMAIN: https://wisecovington.com
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      INDEXNOW_KEY_LOCATION: https://horselegalguide.com/indexnow.txt
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      GSC_INSPECTION_LIMIT: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - run: git pull --rebase origin main
      - name: Refresh sitemap and distribution artifacts after successful manual publish
        run: npm run build
      - name: Validate client and authority systems before provider submission
        run: npm run validate:all
      - name: Run IndexNow, GSC sitemap submission, and priority URL inspection
        run: npm run distribution:post-publish
      - name: Validate post-publish distribution contract
        run: |
          npm run validate:indexnow-workflow
          npm run validate:authority-distribution
      - name: Commit durable distribution receipts and observation feedback
        run: |
          git config user.name "horse-distribution-observer"
          git config user.email "actions@github.com"
          git add data/distribution
          if git diff --cached --quiet; then
            echo "No distribution receipt changes."
          else
            git commit -m "Record post-publish distribution receipt"
            git push origin main
          fi
      - name: Upload distribution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: horse-legal-guide-distribution-evidence
          path: |
            data/distribution
            .build
            _ops/reports
