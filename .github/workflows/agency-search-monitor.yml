name: Agency Search Monitor

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "refresh_all"
        required: true
        default: "refresh_all"
      receipt_id:
        required: false
        default: ""
      requested_by:
        required: false
        default: ""
      request_reason:
        required: false
        default: ""
  schedule:
    - cron: '17 14 * * *'

permissions:
  contents: write

concurrency:
  group: horse-legal-guide-main-writer
  cancel-in-progress: false
jobs:
  monitor:
    timeout-minutes: 41  # ~4x median 10.1m over 8 green runs; fault detector, not a budget
    runs-on: ubuntu-latest
    env:
      LIVE_SITE_URL: https://horselegalguide.com
      SITE_DOMAIN: https://horselegalguide.com
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
          # Only GSC_SERVICE_ACCOUNT_JSON is passed, and the other three names are
          # removed rather than left empty.
          #
          # They were dead: no secret of those names exists on this repo, and
          # scripts/queries/ingest_gsc_evidence.py reads GSC_SERVICE_ACCOUNT_JSON and
          # nothing else. gsc_provider_ops.mjs prefers the JSON too, so the
          # EMAIL/PRIVATE_KEY pair could not shadow it here - unlike
          # hicks-consulting-canonical, where the opposite precedence meant a revoked
          # pair won every run.
          #
          # GSC_ACCESS_TOKEN is the one that mattered: token() returns it before it
          # ever builds a service-account JWT, so setting it would silently outrank the
          # working credential. It was harmless only because it resolved to an empty
          # string. Passing a name that can outrank the real credential, for a secret
          # that does not exist, is a trap waiting for someone to set it.
      GSC_INSPECTION_LIMIT: 10
      BING_SITE_URL: ${{ secrets.BING_SITE_URL }}
      BING_WEBMASTER_API_KEY: ${{ secrets.BING_WEBMASTER_API_KEY }}
      # No model key is passed here (owner policy, 11 Oct 2026: nothing paid).
      # search:cycle's live observer records DISABLED_BY_OWNER_POLICY; paid
      # observation runs only from paid-citation-probe.yml with confirm_paid.
      QUERY_MEASUREMENT_PANEL_SIZE: "30"
      LIVE_QUERY_LIMIT: "30"
    steps:
      # Dispatching this workflow on a branch used to run the branch's YAML
      # against main's code, so a change to the search cycle could not be
      # exercised before it was merged. The checkout follows the dispatch ref
      # now; every write below stays gated to main.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - run: npm ci
      - if: ${{ github.ref_name == 'main' }}
        run: git pull --rebase origin main
      # The measured search loop (data/search_intelligence/). Runs first and
      # commits on its own, so a red operation step below never costs a day of
      # Search Console truth or index coverage. Collectors print a NAMED STOP and
      # exit 0 when the credential is missing or refused; anything else is red.
      - name: Measured search loop (truth, coverage, sitemaps, targets, families)
        id: measured_loop
        run: |
          set -euo pipefail
          node scripts/search_intelligence/collect_gsc.js
          node scripts/search_intelligence/collect_index_coverage.js
          node scripts/search_intelligence/build_loop.js
      - name: Commit measured search loop
        if: ${{ steps.measured_loop.outcome == 'success' && github.ref_name == 'main' }}
        run: |
          git config user.name "horse-search-monitor"
          git config user.email "actions@github.com"
          git add data/search_intelligence
          if git diff --cached --quiet; then
            echo "No measured-loop changes to commit."
          else
            git commit -m "chore: refresh Search Console truth and index coverage"
            # main moves during the ~3 min this loop runs (merges, bot lanes):
            # 11 Oct 2026 run 38161572440 was rejected non-fast-forward when PR #51
            # merged mid-run. Rebase onto the new main first; this commit only
            # touches data/search_intelligence, which only this step writes, so on
            # a conflict this run's fresh measurement wins (-X theirs = the commit
            # being replayed).
            git pull --rebase -X theirs origin main
            bash scripts/ops/push_with_retry.sh origin main
          fi
      - name: Refresh providers, intelligence, and private agency report
        id: operation
        continue-on-error: true
        run: |
          set -euo pipefail
          node scripts/agency/refresh_search_health.js
          # search:cycle ends in search:prepare-repairs, which reads the page
          # manifests that `npm run build` writes to .build/page-manifests/.
          # It used to run before the build, so the repair plan was derived from
          # whatever manifest the previous run had committed rather than from
          # this run's own pages.
          #
          # The dependency runs both ways, which is why one build cannot sit at
          # either end: the cycle needs the manifests the build produces, and
          # build_site_release.js copies the cycle's query_repair_queue.json into
          # dist/data/. So build to produce the manifests, run the cycle against
          # them, then rebuild so dist carries this run's repair queue rather
          # than the previous run's.
          npm run build
          npm run search:cycle
          node scripts/query/build_provider_query_intelligence.js
          node scripts/remediation/build_remediation_queue.js
          npm run build
          npm run validate:agency-monitoring
          npm run validate:query-intelligence
          npm run validate:remediation-workflow
      # The "Report why" half of the gate convention used by drafts-refresh.yml
      # and approved-content-email.yml. live_query_observer.js exits 0 only when
      # every provider failure was owner-held (401/403/402/429 or no key); any
      # other failure shape still fails the step above and this lane stays red.
      # So when a blackout is green, this step is what names it.
      - name: Report whether live citation observation happened
        if: always()
        run: node scripts/search/report_provider_blackout.mjs
      # Writes only ever land on main. A branch run is a read-only rehearsal.
      - name: Commit monitoring snapshots
        if: ${{ steps.operation.outcome == 'success' && github.ref_name == 'main' }}
        run: |
          git config user.name "horse-search-monitor"
          git config user.email "actions@github.com"
          git add data/signals data/queries data/agency data/search data/system data/query_intelligence data/remediation reports/agency reports/query_intelligence reports/remediation dist/agency dist/data/agency dist/data/query_intelligence dist/data/remediation
          if git diff --cached --quiet; then
            echo "No monitoring changes to commit."
          else
            git commit -m "chore: refresh GSC Bing and agency intelligence"
            # Same race as the measured-loop commit above: main moves during the run.
            git pull --rebase origin main
            bash scripts/ops/push_with_retry.sh origin main
          fi
      - name: Upload monitoring evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: horse-legal-guide-agency-monitor
          path: |
            data/search_intelligence
            data/agency
            data/search
            data/system
            data/query_intelligence
            data/remediation
            reports/agency
            reports/query_intelligence
            reports/remediation

      - name: Write authenticated action receipt
        if: ${{ always() && inputs.receipt_id != '' }}
        env:
          RECEIPT_ID: ${{ inputs.receipt_id }}
          REQUESTED_BY: ${{ inputs.requested_by }}
          REQUEST_REASON: ${{ inputs.request_reason }}
          ACTION_STATUS: ${{ steps.operation.outcome }}
          OPERATION: ${{ inputs.operation || inputs.action }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: node scripts/admin/write_action_receipt.js
      - name: Commit authenticated action receipt
        if: ${{ always() && inputs.receipt_id != '' }}
        run: |
          git config user.name "horse-legal-guide-admin"
          git config user.email "actions@github.com"
          git add data/admin/action_receipts
          if git diff --cached --quiet; then
            echo "No receipt change to commit."
          else
            git commit -m "chore: record authenticated admin action"
            bash scripts/ops/push_with_retry.sh origin main
          fi
      - name: Preserve operation failure
        if: ${{ steps.operation.outcome != 'success' }}
        run: exit 1
