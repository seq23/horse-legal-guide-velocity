name: Admin Bulk Content Actions

on:
  workflow_dispatch:
    inputs:
      action:
        description: "approve_many, reject_many, mark_many_needs_revision, set_publish_date_many, clear_publish_date_many, approve_all_eligible, approve_by_quality, approve_by_type, approve_by_cluster, dry_run"
        required: true
        default: "dry_run"
      ids:
        description: "Space-separated entry IDs for many-actions"
        required: false
        default: ""
      publish_date:
        description: "YYYY-MM-DD for set_publish_date_many"
        required: false
        default: ""
      content_type:
        description: "Content type for approve_by_type"
        required: false
        default: ""
      cluster:
        description: "Source cluster for approve_by_cluster"
        required: false
        default: ""
      min_quality_score:
        description: "Minimum quality score for approve_by_quality"
        required: false
        default: "90"
      dry_run:
        description: "true keeps this non-mutating"
        required: false
        default: "true"
      receipt_id:
        description: "Authenticated admin receipt ID"
        required: false
        default: ""
      requested_by:
        description: "Authenticated GitHub login"
        required: false
        default: ""
      request_reason:
        description: "Operator-supplied action reason"
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: horse-legal-guide-main-writer
  cancel-in-progress: false
jobs:
  admin-bulk-action:
    runs-on: ubuntu-latest
    env:
      SITE_DOMAIN: https://horselegalguide.com
      CANONICAL_DOMAIN: https://wisecovington.com
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      INDEXNOW_KEY_LOCATION: https://horselegalguide.com/indexnow.txt
      GSC_SITE_URL: sc-domain:horselegalguide.com
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Refresh self-heal and prevalidation before action
        id: preflight
        continue-on-error: true
        run: |
          npm run content:self-heal
          npm run content:prevalidate
          npm run build
          npm run ops:trace-workflows
      - name: Execute requested admin action
        id: operation
        continue-on-error: true
        if: ${{ steps.preflight.outcome == 'success' && inputs.dry_run != 'true' && inputs.action != 'dry_run' }}
        env:
          ACTION_INPUT: ${{ inputs.action }}
          IDS_INPUT: ${{ inputs.ids }}
          PUBLISH_DATE_INPUT: ${{ inputs.publish_date }}
          CONTENT_TYPE_INPUT: ${{ inputs.content_type }}
          CLUSTER_INPUT: ${{ inputs.cluster }}
          MIN_QUALITY_SCORE_INPUT: ${{ inputs.min_quality_score }}
        run: |
          set -euo pipefail
          read -r -a IDS <<< "$IDS_INPUT"
          case "$ACTION_INPUT" in
            approve_many) node scripts/admin/approve_many.js "${IDS[@]}" ;;
            reject_many) node scripts/admin/reject_many.js "${IDS[@]}" ;;
            mark_many_needs_revision) node scripts/admin/mark_many_needs_revision.js "${IDS[@]}" ;;
            set_publish_date_many) node scripts/admin/set_publish_date_many.js "$PUBLISH_DATE_INPUT" "${IDS[@]}" ;;
            clear_publish_date_many) node scripts/admin/clear_publish_date_many.js "${IDS[@]}" ;;
            approve_all_eligible) node scripts/admin/approve_all_eligible.js ;;
            approve_by_quality) node scripts/admin/approve_by_quality.js "$MIN_QUALITY_SCORE_INPUT" ;;
            approve_by_type) node scripts/admin/approve_by_type.js "$CONTENT_TYPE_INPUT" ;;
            approve_by_cluster) node scripts/admin/approve_by_cluster.js "$CLUSTER_INPUT" ;;
            *) echo "Unknown action: $ACTION_INPUT"; exit 1 ;;
          esac
      - name: Dry run summary
        if: ${{ steps.preflight.outcome == 'success' && (inputs.dry_run == 'true' || inputs.action == 'dry_run') }}
        env:
          ACTION_INPUT: ${{ inputs.action }}
          IDS_INPUT: ${{ inputs.ids }}
        run: |
          echo "Dry run only. No content status changed."
          printf 'Action requested: %s\n' "$ACTION_INPUT"
          printf 'IDs: %s\n' "$IDS_INPUT"
      - name: Rebuild and validate after action
        if: ${{ steps.preflight.outcome == 'success' && (steps.operation.outcome == 'success' || inputs.dry_run == 'true' || inputs.action == 'dry_run') }}
        run: |
          npm run build
          npm run validate:all
      - name: Commit admin content action
        if: ${{ steps.operation.outcome == 'success' && inputs.dry_run != 'true' && inputs.action != 'dry_run' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/system/editorial_backlog.json data/system/content_calendar.json data/admin data/content_atoms reports/workflow-trace dist .build
          if git diff --cached --quiet; then
            echo "No admin action changes to commit."
            exit 0
          fi
          git commit -m "chore: run admin bulk content action"
          git push
      - name: Write authenticated action receipt
        if: ${{ always() && inputs.receipt_id != '' }}
        env:
          RECEIPT_ID: ${{ inputs.receipt_id }}
          REQUESTED_BY: ${{ inputs.requested_by }}
          REQUEST_REASON: ${{ inputs.request_reason }}
          ACTION_STATUS: ${{ steps.preflight.outcome != 'success' && 'failure' || steps.operation.outcome || 'success' }}
          OPERATION: ${{ inputs.action }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: node scripts/admin/write_action_receipt.js
      - name: Commit authenticated action receipt
        if: ${{ always() && inputs.receipt_id != '' }}
        run: |
          git config user.name "horse-legal-guide-admin"
          git config user.email "actions@github.com"
          git add data/admin/action_receipts
          if git diff --cached --quiet; then
            echo "No receipt change to commit."
          else
            git commit -m "chore: record authenticated admin action"
            git push origin main
          fi
      - name: Preserve operation failure
        if: ${{ steps.preflight.outcome != 'success' || steps.operation.outcome == 'failure' }}
        run: exit 1
