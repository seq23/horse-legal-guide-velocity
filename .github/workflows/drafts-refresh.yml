name: Draft Queue Refresh

on:
  workflow_dispatch:
  schedule:
    - cron: "15 11 * * *"

permissions:
  contents: write

concurrency:
  group: horse-legal-guide-main-writer
  cancel-in-progress: false

jobs:
  refresh-drafts:
    runs-on: ubuntu-latest
    env:
      SITE_DOMAIN: https://horselegalguide.com
      CANONICAL_DOMAIN: https://wisecovington.com
      GSC_SITE_URL: sc-domain:horselegalguide.com
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      INDEXNOW_KEY_LOCATION: https://horselegalguide.com/indexnow.txt
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: true
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install
        run: npm ci
      # Cadence for a client repo is measured in drafts the client can still get
      # through, not in drafts produced. 306 are pending and the last approval was
      # 2026-04-29, so this stops adding to a queue nobody is emptying. It never
      # fails - a full queue is a decision waiting on a person, not a broken build.
      - name: Draft queue cadence gate
        id: draft_gate
        run: node scripts/cadence/draft_queue_gate.mjs
      - name: Generate drafts
        if: steps.draft_gate.outputs.should_draft == 'true'
        run: npm run generate:drafts
      - name: Report why no drafts were generated
        if: steps.draft_gate.outputs.should_draft != 'true'
        run: echo "Skipped drafting - ${{ steps.draft_gate.outputs.pending }} drafts are awaiting client approval. Approve via Admin Bulk Content Actions (workflow_dispatch)."
      - name: Self-heal generated drafts
        run: npm run content:self-heal
      - name: Prevalidate generated drafts
        run: npm run content:prevalidate
      - name: Build site and admin dashboards
        run: npm run build
      - name: Validate approved-only public output
        run: npm run validate:publish-safety
      - name: Generate workflow trace
        run: npm run ops:trace-workflows
      - name: Apply manual mode
        run: npm run publish:mode
      - name: Validate all
        run: npm run validate:all
      - name: Commit refreshed draft queue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/drafts/generated data/system/content_calendar.json data/system/editorial_backlog.json data/admin data/content_atoms reports/workflow-trace reports/cadence dist .build data/content_refresh_state.json data/system/automation_mode.json data/firm
          if git diff --cached --quiet; then
            echo "No draft queue changes to commit."
            exit 0
          fi
          git commit -m "chore: refresh draft queue and admin dashboard"
          git push
