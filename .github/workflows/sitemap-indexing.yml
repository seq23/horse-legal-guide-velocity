name: Sitemap And Indexing

on:
  workflow_dispatch:

jobs:
  submit-indexing:
    runs-on: ubuntu-latest
    env:
      SITE_DOMAIN: https://horselegalguide.com
      INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
      INDEXNOW_KEY_LOCATION: https://horselegalguide.com/indexnow.txt
      GSC_SITE_URL: ${{ secrets.GSC_SITE_URL }}
      GSC_SERVICE_ACCOUNT_JSON: ${{ secrets.GSC_SERVICE_ACCOUNT_JSON }}
      GSC_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GSC_SERVICE_ACCOUNT_EMAIL }}
      GSC_PRIVATE_KEY: ${{ secrets.GSC_PRIVATE_KEY }}
      GSC_ACCESS_TOKEN: ${{ secrets.GSC_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Submit IndexNow
        run: ./distribution_scripts/indexnow_submit.sh || true
      - name: Submit sitemaps to GSC
        run: node scripts/distribution/gsc_provider_ops.mjs submit-sitemaps
      - name: Inspect priority URLs
        run: node scripts/distribution/gsc_provider_ops.mjs inspect
